<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello from a static site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>This page is plain HTML, CSS and JavaScript. There is no server code behind
       it, just files being served.</p>

    <p class="card">
      The three files are <code>index.html</code>, <code>style.css</code> and
      <code>script.js</code>. Edit them, push, and deploy again to see the change.
    </p>

    <p>
      <button id="press">Press me</button>
      <span id="said" role="status"></span>
    </p>

    <p class="clock">Loaded at <time id="when"></time></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
